name: Cutting Edge Builds

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cutting-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard-configurations:
    name: Standard ${{ matrix.architecture }} ${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, Win32, ARM64]
        configuration: [Debug, Release, RelWithDebInfo, MinSizeRel]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.architecture }} -DMUSICOVERLAY_NOCRT=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Package metadata
        shell: pwsh
        run: |
          $output = "build/${{ matrix.configuration }}"
          "commit=${{ github.sha }}`nconfiguration=${{ matrix.configuration }}`narchitecture=${{ matrix.architecture }}`nmode=standard" | Set-Content "$output/build-info.txt"

      - name: Upload cutting-edge artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutting-edge-standard-${{ matrix.architecture }}-${{ matrix.configuration }}
          path: |
            build/${{ matrix.configuration }}/musicoverlay_app.exe
            build/${{ matrix.configuration }}/musicoverlay.lib
            build/${{ matrix.configuration }}/build-info.txt
          if-no-files-found: error
          retention-days: 14

  nocrt-configurations:
    name: No-CRT ${{ matrix.architecture }} ${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, Win32, ARM64]
        configuration: [Debug, Release, RelWithDebInfo, MinSizeRel]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.architecture }} -DMUSICOVERLAY_NOCRT=ON -DMUSICOVERLAY_BUILD_INTEGRATION=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Package metadata
        shell: pwsh
        run: |
          $output = "build/${{ matrix.configuration }}"
          "commit=${{ github.sha }}`nconfiguration=${{ matrix.configuration }}`narchitecture=${{ matrix.architecture }}`nmode=nocrt" | Set-Content "$output/build-info.txt"

      - name: Upload cutting-edge artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutting-edge-nocrt-${{ matrix.architecture }}-${{ matrix.configuration }}
          path: |
            build/${{ matrix.configuration }}/musicoverlay_app.exe
            build/${{ matrix.configuration }}/build-info.txt
          if-no-files-found: error
          retention-days: 14
