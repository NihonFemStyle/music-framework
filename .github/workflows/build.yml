name: Pull Request Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release, RelWithDebInfo, MinSizeRel]
        architecture: [x64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Visual Studio 2022
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.architecture }}

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PR-Nihons-Music-Framework-${{ matrix.architecture }}-${{ matrix.configuration }}
          path: build/${{ matrix.configuration }}/musicoverlay_app.exe
          if-no-files-found: error
          retention-days: 7

  sdl:
    name: SDL ${{ matrix.architecture }} ${{ matrix.configuration }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release, RelWithDebInfo, MinSizeRel]
        architecture: [x64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Visual Studio 2022
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Cache SDL dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: sdl-3.4.16-${{ runner.os }}-${{ matrix.architecture }}

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.architecture }} -DMUSICOVERLAY_BUILD_SDL_FRONTEND=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Upload SDL executable
        uses: actions/upload-artifact@v4
        with:
          name: PR-Nihons-Music-Framework-SDL-${{ matrix.architecture }}-${{ matrix.configuration }}
          path: build/${{ matrix.configuration }}/musicoverlay_sdl.exe
          if-no-files-found: error
          retention-days: 7


