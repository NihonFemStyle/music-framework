name: Pull Request Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release, RelWithDebInfo, MinSizeRel]
        architecture: [x64]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.architecture }}

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PR-Nihons-Music-Framework-${{ matrix.architecture }}-${{ matrix.configuration }}
          path: build/${{ matrix.configuration }}/musicoverlay_app.exe
          if-no-files-found: error
          retention-days: 7


